<!DOCTYPE html><html lang="th"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจและอนุมัติผลสรุป | Summa</title>
  <link rel="stylesheet" href="assets/styles/fonts.css">
  <link rel="stylesheet" href="assets/styles/shared.css">
  <link rel="stylesheet" href="assets/styles/review.css">
  <script defer="" src="assets/services/auth-policy.js"></script>
  <script defer="" src="assets/components/confirm-dialog.js"></script>
  <script defer="" src="assets/components/navbar.js"></script>
  <script defer="" src="assets/js/app.js"></script>
  <script defer="" src="assets/services/firebase.bundle.js"></script>
  <script defer="" src="assets/js/review.js"></script>
</head>
<body data-page="review" data-role="advisor" data-auth="pending"><div id="navbar-root"></div><div id="auth-status" class="page-feedback form-alert" role="alert" hidden=""></div><main id="main-content" tabindex="-1"><div id="page-root"></div></main><template id="page-template"><p class="page-feedback demo-notice">สกัดข้อความด้วย Gemma 4 ได้จริง · รายการโครงงานและการเผยแพร่ยังเป็นตัวอย่าง ไม่บันทึกอีเมลหรือผลสรุปลงฐานข้อมูลอัตโนมัติ</p>

<div class="page-full-height review-style-1">

<div class="page-full-height review-style-2">

<!-- SIDE -->
<div class="responsive-sidebar review-style-3">
  <div>
    <div class="review-style-4">ตัวอย่างอีเมล · ยังไม่ดึงจาก Gmail</div>
    <div class="review-style-5">
      <template data-each="queue" data-as="q">
        <div style="border:1.5px solid {{q.border}};background:{{q.bg}}" class="review-style-6">
          <div class="review-style-7">{{q.project}}</div>
          <div class="review-style-8">{{q.sub}}</div>
          <div class="review-style-9">{{q.time}}</div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="responsive-page-padding review-style-10">
  <div class="review-style-11">
    <div class="review-style-12">
      <h1 class="review-style-13">สกัดและตรวจสอบข้อมูลอีเมล</h1>
      <div class="review-style-14">ตรวจผลสรุป งาน และนัดหมายเทียบกับข้อความต้นฉบับ</div>
    </div>
    <div style="background:{{statusBg}};color:{{statusFg}}" class="review-style-15">{{statusText}}</div>
  </div>

  <section class="review-ai-input" aria-label="ประมวลผลอีเมลด้วย Gemma 4">
    <label for="email-source">ข้อความอีเมลที่ต้องการสกัดข้อมูล</label>
    <p>วางข้อความอีเมลแล้วกดสกัดข้อมูล ข้อความจะถูกส่งไปประมวลผลด้วย Gemma 4 บน Ollama Cloud</p>
    <textarea id="email-source" rows="6" maxlength="20000" value="{{original}}" data-on-change="{{sourceChanged}}" disabled="{{busy}}"></textarea>
    <button type="button" data-on-click="{{synthesize}}" disabled="{{busy}}">{{processLabel}}</button>
    <span role="status" aria-live="polite">{{aiLabel}}</span>
    <template data-if="hasError"><p role="alert" class="review-ai-error">{{error}}</p></template>
  </section>

  <div class="review-style-16">

    <!-- original -->
    <div class="review-style-17">
      <div class="review-style-18">ข้อความต้นฉบับ</div>
      <div class="review-style-19">
        <span>ต้นฉบับจากช่องข้อความอีเมลด้านบน</span><span>ยังไม่ได้จับคู่กับโครงงานจริง</span>
      </div>
      <div class="review-style-20">
        <template data-each="segments" data-as="s">
          <template data-if="s.isHl">
            <button type="button" data-on-click="{{s.pick}}" style="background:{{s.bg}}" class="review-style-21">{{s.text}}</button>
          </template>
          <template data-if="s.isPlain"><span>{{s.text}}</span></template>
        </template>
        <p class="review-style-22">คลิกรายการผลสรุปเพื่อไฮไลต์ข้อความต้นฉบับที่ใช้อ้างอิง</p>
      </div>
    </div>

    <!-- AI summary -->
    <div class="review-style-17">
      <div class="review-style-23">
        <span>ผลสรุปจาก AI</span><span class="review-style-24">{{aiLabel}}</span>
      </div>
      <div class="review-style-25">{{summary}}</div>
      <template data-if="hasResult"><label class="review-summary-label" for="summary-edit">ตรวจแก้ข้อความสรุปก่อนตรวจรับ</label><textarea id="summary-edit" class="review-summary-edit" rows="4" value="{{summary}}" data-on-change="{{editSummary}}" disabled="{{busy}}"></textarea></template>
      <template data-if="noItems"><p class="review-style-25">ไม่พบรายการงานหรือนัดหมายที่ต้องดำเนินการ</p></template>
      <div class="review-style-26">
        <template data-each="items" data-as="it">
          <button type="button" data-on-click="{{it.pick}}" style="border:1.5px solid {{it.border}};background:{{it.bg}}" class="review-style-27">
            <span class="review-style-28">{{it.kind}}</span>
            <span class="review-style-29">{{it.title}}</span>
            <span class="review-style-30">ผู้รับผิดชอบ {{it.owner}} · {{it.due}}</span>
            <template data-if="it.warn">
              <span class="review-style-31">ไม่พบวันเวลาชัดเจน กรุณาตรวจสอบก่อนนำไปใช้</span>
            </template>
            <template data-each="it.evidence" data-as="quote"><span class="review-evidence">อ้างอิง: “{{quote.text}}”</span></template>
          </button>
        </template>
      </div>
    </div>
  </div>

  <!-- actions -->
  <div class="review-style-32">
    <div class="review-style-33">{{hint}}</div>
    <div class="review-style-34">
      <button type="button" data-on-click="{{reject}}" disabled="{{actionDisabled}}" class="page-full-height review-style-35">ปฏิเสธ</button>
      <button type="button" data-on-click="{{reprocess}}" disabled="{{busy}}" class="page-full-height review-style-35">ประมวลผลใหม่</button>
      <button type="button" data-on-click="{{approve}}" disabled="{{actionDisabled}}" class="page-full-height review-style-36">{{approveLabel}}</button>
    </div>
  </div>
</div>

</div>
</div>
</template><noscript><p>กรุณาเปิด JavaScript เพื่อใช้งานหน้านี้</p></noscript><footer class="site-footer">Summa · บัญชีผู้ใช้เชื่อมต่อ Firebase · ข้อมูลโครงงานและการเชื่อมต่ออื่นเป็นตัวอย่าง</footer>
</body></html>
