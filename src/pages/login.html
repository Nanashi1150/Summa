<!DOCTYPE html><html lang="th"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | Summa</title>
  <link rel="stylesheet" href="assets/styles/fonts.css">
  <link rel="stylesheet" href="assets/styles/shared.css">
  <link rel="stylesheet" href="assets/styles/login.css">
  <script defer="" src="assets/services/auth-policy.js"></script>
  <script defer="" src="assets/components/confirm-dialog.js"></script>
  <script defer="" src="assets/components/navbar.js"></script>
  <script defer="" src="assets/js/app.js"></script>
  <script defer="" src="assets/services/firebase.bundle.js"></script>
  <script defer="" src="assets/js/login.js"></script>
</head>
<body data-page="login" data-role="public" data-auth="pending"><div id="auth-status" class="page-feedback form-alert" role="alert" hidden=""></div><main id="main-content" tabindex="-1"><div id="page-root"></div></main><template id="page-template"><div class="login-screen">
  <section class="login-story" aria-label="Summa">
    <a class="login-brand" href="index.html"><span class="brand-mark" aria-hidden="true">≡</span> Summa</a>
    <div><p class="login-eyebrow">จากข้อเสนอแนะ สู่ความคืบหน้า</p><p class="login-quote">ข้อเสนอแนะของอาจารย์<br>ชัดเจนขึ้น <mark>ทุกครั้งที่พบกัน</mark></p><p>รวมงาน นัดหมาย และความคืบหน้าโครงงานไว้ในที่เดียว</p></div>
    <p class="login-story-footer">ระบบสรุปข้อเสนอแนะและนัดหมายอาจารย์ที่ปรึกษาโครงงาน</p>
  </section>
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-form-wrap">
      <p class="login-eyebrow">ยินดีต้อนรับสู่ Summa</p>
      <h1 id="login-title">เข้าสู่ระบบ</h1>
      <p class="login-description">ใช้บัญชีที่ได้รับอนุมัติแล้ว เพื่อเข้าสู่พื้นที่ทำงานตามสิทธิ์ของคุณ</p>
      <template data-if="hasError"><div class="form-alert" role="alert">{{error}}</div></template>
      <template data-if="hasNotice"><div class="form-notice" role="status">{{notice}}</div></template>
      <form data-on-submit="{{submit}}" novalidate="">
        <label for="email">อีเมล</label>
        <input id="email" name="email" type="email" autocomplete="username" required="" value="{{email}}" data-on-change="{{setEmail}}" placeholder="admin@summa.ac.th" aria-describedby="admin-email-hint" disabled="{{busy}}">
        <p id="admin-email-hint" class="field-hint">ตัวอย่างอีเมลผู้ดูแล: admin@summa.ac.th — ใช้อีเมลบัญชีจริงของคุณ</p>
        <div class="password-label"><label for="pw">รหัสผ่าน</label><button class="text-button" type="button" data-on-click="{{resetPassword}}" disabled="{{busy}}">ลืมรหัสผ่าน?</button></div>
        <input id="pw" name="password" type="password" autocomplete="current-password" required="" value="{{password}}" data-on-change="{{setPassword}}" disabled="{{busy}}">
        <button class="login-submit" data-login-submit="" type="submit" disabled="{{busy}}">{{loginLabel}}</button>
      </form>
      <div class="login-divider"><span>หรือ</span></div>
      <button class="google-login" type="button" data-on-click="{{googleLogin}}" disabled="{{busy}}"><span aria-hidden="true">G</span> เข้าสู่ระบบด้วย Google</button>
      <p class="login-register">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
      <p class="field-hint login-admin-note">สิทธิ์ผู้ดูแลระบบกำหนดโดยเจ้าของระบบเท่านั้น</p>
      <a class="back-home" href="index.html">← กลับหน้าแรก</a>
    </div>
  </section>
</div>
</template><noscript><p>กรุณาเปิด JavaScript เพื่อใช้งานหน้านี้</p></noscript><footer class="site-footer">Summa · บัญชีผู้ใช้เชื่อมต่อ Firebase · ข้อมูลโครงงานและการเชื่อมต่ออื่นเป็นตัวอย่าง</footer>
</body></html>
